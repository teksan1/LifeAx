<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeAx AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{width:100%;max-width:800px;height:90vh;background:rgba(255,255,255,0.95);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);display:flex;flex-direction:column;overflow:hidden}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:20px;text-align:center;position:relative}
.header h1{font-size:28px;font-weight:600;margin-bottom:5px}
.status{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:13px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.chat-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px}
.message{display:flex;gap:12px;animation:slideIn 0.3s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.message.user{flex-direction:row-reverse}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;font-size:14px}
.user .avatar{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white}
.assistant .avatar{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);color:white}
.message-content{max-width:70%;padding:12px 16px;border-radius:18px;line-height:1.5;word-wrap:break-word}
.user .message-content{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border-bottom-right-radius:4px}
.assistant .message-content{background:#f3f4f6;color:#1f2937;border-bottom-left-radius:4px}
.typing{display:flex;gap:4px;padding:12px 16px}
.typing span{width:8px;height:8px;border-radius:50%;background:#9ca3af;animation:typing 1.4s infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}
.input-container{padding:20px;background:white;border-top:1px solid #e5e7eb}
.input-wrapper{display:flex;gap:10px}
#messageInput{flex:1;padding:12px 16px;border:2px solid #e5e7eb;border-radius:25px;font-size:15px;outline:none;transition:all 0.3s}
#messageInput:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.1)}
#sendBtn{width:50px;height:50px;border:none;border-radius:50%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;font-size:20px;cursor:pointer;transition:transform 0.2s}
#sendBtn:hover{transform:scale(1.05)}
#sendBtn:active{transform:scale(0.95)}
#sendBtn:disabled{opacity:0.5;cursor:not-allowed}
.welcome{text-align:center;padding:40px 20px;color:#6b7280}
.clear-btn{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.2);border:none;color:white;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px}
@media(max-width:600px){.container{height:100vh;border-radius:0}.message-content{max-width:85%}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<button class="clear-btn" onclick="clearChat()">Clear</button>
<h1>🤖 LifeAx</h1>
<div class="status"><span class="status-dot"></span><span>Online</span></div>
</div>
<div class="chat-container" id="chat">
<div class="welcome"><h2>Welcome to LifeAx! 👋</h2><p>Ask me anything</p></div>
</div>
<div class="input-container">
<div class="input-wrapper">
<input type="text" id="messageInput" placeholder="Type your message...">
<button id="sendBtn" onclick="sendMessage()">➤</button>
</div>
</div>
</div>
<script>
const API='http://127.0.0.1:8000';
const chat=document.getElementById('chat');
const input=document.getElementById('messageInput');
const btn=document.getElementById('sendBtn');
input.addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage()});
async function sendMessage(){
const msg=input.value.trim();
if(!msg)return;
input.disabled=btn.disabled=true;
const w=chat.querySelector('.welcome');
if(w)w.remove();
addMsg(msg,'user');
input.value='';
const tid=showTyping();
try{
const r=await fetch(`${API}/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
removeTyping(tid);
if(!r.ok)throw new Error('Error');
const d=await r.json();
addMsg(d.reply,'assistant');
}catch(e){
removeTyping(tid);
addMsg('Error. Try again.','assistant');
}finally{
input.disabled=btn.disabled=false;
input.focus();
}
}
function addMsg(text,role){
const div=document.createElement('div');
div.className=`message ${role}`;
div.innerHTML=`<div class="avatar">${role==='user'?'You':'AI'}</div><div class="message-content">${text}</div>`;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}
function showTyping(){
const div=document.createElement('div');
div.className='message assistant';
div.id='typing';
div.innerHTML='<div class="avatar">AI</div><div class="typing"><span></span><span></span><span></span></div>';
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
return 'typing';
}
function removeTyping(id){
const t=document.getElementById(id);
if(t)t.remove();
}
function clearChat(){
if(confirm('Clear chat?')){
chat.innerHTML='<div class="welcome"><h2>Chat Cleared!</h2><p>Start fresh</p></div>';
}
}
</script>
</body>
</html>
